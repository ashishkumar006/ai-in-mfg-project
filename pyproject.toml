[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hybrid-ai"
version = "0.1.0"
description = "Hybrid AI-Expert System for Automated Manufacturing"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]
filterwarnings = [
    # scikit-fuzzy 0.5 internals call np.maximum/np.minimum with an output
    # argument deprecated by numpy 2.x; harmless today, broken upstream.
    "ignore::DeprecationWarning:skfuzzy.*",
]
